<header>
  <div>
    <a class="button" routerLink="/contacts">⬅</a>
    <h1>{{contacto()?.nombre}}</h1>
  </div>
  <button class="secundario">Cerrar sesión</button>
</header>
<main class="card">
  <div>
    <p>Telefono</p> 
    <p>{{contacto()?.numeroTelefono || '—'}}</p>
  </div>
  <div>
    <p>Email</p>
    <p>{{contacto()?.email || '—'}}</p>
  </div>
  <div>
    <p>Dirección</p>
    <p>{{contacto()?.direccion || '—'}}</p>
  </div>
</main>
