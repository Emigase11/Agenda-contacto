<section>
    <form class="form" (submit)="login($event)">
        <h1 class="title">Iniciar sesión</h1>
        <p class="message">Ingresá a tu agenda de contactos.</p>
        <label>
            <input placeholder=" " type="email" class="input" autocomplete="email"
                [class.ok]="formLogin.email().valid()" [formField]="formLogin.email">
            <span>Email</span>
        </label>
        <label>
            <input placeholder=" " type="password" class="input" autocomplete="current-password"
                [class.ok]="formLogin.password().valid()" [formField]="formLogin.password">
            <span>Password</span>
        </label>
        <button class="submit" [disabled]="formLogin().invalid()">Iniciar sesión</button>
        <p class="signin">¿No tenés cuenta? <a routerLink="/register">Registrate</a></p>
    </form>
</section>
