<section>
   <div class="card">  
       <h1>Agenda de contactos</h1>
       <h3>Iniciar sesión</h3>
       <form (submit)="login($event)">
           <div>
               <label for="">Email</label>
               <input type="email" id="" [formField]="formLogin.email">
               <label for="">Password</label>
               <input type="password" id="" [formField]="formLogin.password">
            </div>
            <button [disabled]="formLogin().invalid()">Iniciar sesión</button>
            <p>¿No tenés cuenta? <a routerLink="/register">Registrate</a></p>
        </form>
    </div>
</section>
