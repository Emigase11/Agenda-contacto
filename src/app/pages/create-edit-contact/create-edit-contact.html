<header>
    <div>
        <a class="button" routerLink="/contacts">⬅</a>
        <h1>{{ modoEdicion() ? 'Editar contacto' : 'Nuevo contacto' }}</h1>
    </div>
    <p>
        {{ modoEdicion()
            ? 'Modificá los datos y guardá los cambios.'
            : 'Completá los datos del nuevo contacto.' }}
    </p>
</header>
<main>
    <form class="card" (submit)="onSubmit($event)" novalidate>
        <div class="campo">
            <label for="firstName">Nombre</label>
            <input type="text" [formField]="formContact.firstName" id="firstName" />
        </div>
        <div class="campo">
            <label for="lastName">Apellido</label>
            <input type="text" [formField]="formContact.lastName" id="lastName"/>
        </div>
        <div class="campo">
            <label for="number">Numero de telefono</label>
            <input type="text" [formField]="formContact.number" id="number" />
        </div>
        <div class="campo">
            <label for="email">Email</label>
            <input type="email" [formField]="formContact.email" id="email" />
        </div>
        <div class="campo ancho">
            <label for="address">Dirección</label>
            <input type="text" [formField]="formContact.address" id="address" />
        </div>
        <div class="acciones">
            <a class="button secundario" routerLink="/contacts">Cancelar</a>
            <button>{{ modoEdicion() ? 'Guardar cambios' : 'Agregar contacto' }}</button>
        </div>
    </form>
</main>
